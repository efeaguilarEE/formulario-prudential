<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinámica Prudential</title>
    <!-- Importamos Tailwind CSS para un diseño moderno y responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Importamos la fuente Inter para mejor legibilidad -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-8">

    <!-- Contenedor principal del formulario -->
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden">
        
        <!-- Encabezado corporativo -->
        <div class="bg-blue-800 p-6 text-center">
            <h2 class="text-2xl font-bold text-white">Dinámica Prudential</h2>
            <p class="text-blue-200 mt-2 text-sm">Registro de participación y estrategias de retiro</p>
        </div>

        <!-- Cuerpo del formulario -->
        <div class="p-6 sm:p-8">
            <form id="registroForm" class="space-y-5">
                
                <!-- Código Único -->
                <div>
                    <label for="codigo" class="block text-sm font-semibold text-slate-700 mb-1">Tu Código Único</label>
                    <div class="relative">
                        <input type="text" id="codigo" readonly 
                            class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-center font-mono text-xl font-bold py-3 rounded-lg focus:outline-none tracking-widest"
                            title="Este código se genera automáticamente">
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                            </svg>
                        </div>
                    </div>
                    <p class="text-xs text-slate-500 mt-1 text-center">Guarda este código, es tu identificador.</p>
                </div>

                <!-- Nombre -->
                <div>
                    <label for="nombre" class="block text-sm font-semibold text-slate-700 mb-1">Nombre completo</label>
                    <input type="text" id="nombre" required placeholder="Ej. Ana Gómez"
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                </div>

                <!-- WhatsApp -->
                <div>
                    <label for="whatsapp" class="block text-sm font-semibold text-slate-700 mb-1">Número de WhatsApp</label>
                    <input type="tel" id="whatsapp" required placeholder="Ej. 5512345678"
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                </div>

                <!-- Correo -->
                <div>
                    <label for="correo" class="block text-sm font-semibold text-slate-700 mb-1">Correo electrónico</label>
                    <input type="email" id="correo" required placeholder="ejemplo@correo.com"
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                </div>

                <!-- Botón de Envío -->
                <button type="submit" 
                    class="w-full mt-6 bg-[#25D366] hover:bg-[#1DA851] text-white font-bold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center gap-2">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
                    </svg>
                    Enviar por WhatsApp
                </button>
            </form>
        </div>
    </div>

    <script>
        // Función para generar un código alfanumérico de 6 dígitos sin la letra 'I'
        function generarCodigo() {
            // Alfabeto (sin la letra I) y números
            const caracteres = 'ABCDEFGHJKLMNOPQRSTUVWXYZ0123456789'; 
            let codigo = '';
            for (let c = 0; c < 6; c++) {
                codigo += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
            }
            return codigo;
        }

        // Asignar el código generado al input correspondiente al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('codigo').value = generarCodigo();
        });

        // Manejar el evento de envío del formulario
        document.getElementById('registroForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevenir recarga de la página

            // Obtener datos del formulario
            const codigo = document.getElementById('codigo').value;
            const nombre = document.getElementById('nombre').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const correo = document.getElementById('correo').value;

            // --- CONFIGURACIÓN DEL NÚMERO ---
            // Número fijo de destino (incluye código de país 52)
            const numeroDestino = '525660158164'; 

            // Construir el mensaje exacto solicitado
            const mensaje = `Hola soy ${nombre}, mi cel es ${whatsapp} y mi mail es ${correo} quiero participar en la dinámica de Prudential y quiero poder conocer más de las estrategias de retiro y cuidado de mi familia.\n\nMi código es: ${codigo}`;

            // Crear la URL de WhatsApp y abrir en nueva pestaña
            const urlWhatsApp = `https://wa.me/${numeroDestino}?text=${encodeURIComponent(mensaje)}`;
            window.open(urlWhatsApp, '_blank');
        });
    </script>
</body>
</html>
